<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion 2 — Title Finder (prototype)</title>
<style>
:root{color-scheme:dark;--bg:#1a1a19;--panel:#242423;--line:#3a3a37;--ink:#fff;--ink2:#c3c2b7;--ink3:#8f8e85;
 --g11:#9a998f;--g21:#199e70;--g31:#3987e5;--g41:#c98500;--g51:#e66767;--hl:#d95926}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--ink3);font-size:12px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--ink);
 border-radius:8px;padding:6px 10px;width:200px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);
 padding:4px 11px;border-radius:999px;cursor:pointer;font-size:12.5px}
.chips button.on{color:var(--ink);border-color:var(--hl);font-weight:600}
.statbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.statbox h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.count{color:var(--ink3);font-size:12.5px;margin:8px 2px}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin:10px 0}
.pick{background:var(--panel);border:1px solid var(--hl);border-radius:12px;padding:10px 12px}
.pick .slot{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--hl)}
table{border-collapse:collapse;width:100%;font-size:12.8px;margin-top:6px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;
 padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid #2b2b29;vertical-align:top;color:var(--ink2)}
td.nm{font-weight:600}
.stat{white-space:nowrap}
.stat b{color:var(--ink)}
.desc{color:var(--ink3);font-size:11.5px;max-width:330px}
.score{color:var(--hl);font-weight:700;text-align:right}
</style></head>
<body><div class="wrap">
<h1>Title Finder <span style="font-size:12px;color:var(--hl)">PROTOTYPE</span></h1>
<div class="sub">1,472 titles. Pick stats you care about → titles carrying them rank by total value. Filters stack. Score = sum of selected stats (equip + owned).</div>
<div class="bar">
  <input type="text" id="q" placeholder="search name / obtain text…">
  <div class="chips" id="slotChips"></div>
  <div class="chips" id="raceChips"></div>
  <div class="chips" id="gradeChips"></div>
  <div class="chips" id="catChips"></div>
</div>
<div class="statbox"><h3>Stats (click to select — equip ▲ and owned ● both count)</h3>

<div class="chips" id="statChips"></div></div>
<div class="top3" id="top3"></div>
<div class="count" id="count"></div>
<table><thead><tr>

</tr></thead><tbody id="rows"></tbody></table>
</div>

const GC={11:'var(--g11)',21:'var(--g21)',31:'var(--g31)',41:'var(--g41)',51:'var(--g51)'};
const GN={11:'Common',21:'Rare',31:'Legend',41:'Unique',51:'Heroic'};
const gn=g=>GN[g]||'Event';const gc=g=>GC[g]||'var(--ink3)';
const state={q:'',slot:null,race:'light',grade:null,cat:null,stats:new Set()};
const $=id=>document.getElementById(id);
// stat frequency for chip ordering
const freq={};
for(const t of T){for(const k in t.e)freq[k]=(freq[k]||0)+1;for(const k in t.o)freq[k]=(freq[k]||0)+1;}
const STATS=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);

function chips(el,opts,get,set,allLabel){
  const box=$(el);box.innerHTML='';
  const mk=(label,val)=>{const b=document.createElement('button');
    b.textContent=label;if(get()===val)b.classList.add('on');
    b.onclick=()=>{set(get()===val?null:val);render();};box.appendChild(b);};
  if(allLabel!==undefined)mk(allLabel,null);
  for(const [l,v] of opts)mk(l,v);
}
function score(t){let s=0;for(const k of state.stats){s+=(t.e[k]||0)+(t.o[k]||0);}return s;}
function fmt(o,sel){return Object.entries(o).map(([k,v])=>
  `<span class="stat" style="${sel.has(k)?'color:var(--hl)':''}">${k} <b>${v}</b></span>`).join(', ')||'—';}

function render(){
  chips('slotChips',[['attack','attack'],['defense','defense'],['utility','utility'],['no-equip','none']],()=>state.slot,v=>state.slot=v,'any slot');
  chips('raceChips',[['Elyos','light'],['Asmodian','dark'],['both','all']],()=>state.race,v=>state.race=v);
  chips('gradeChips',[['Unique',41],['Legend',31],['Rare',21],['Common',11]],()=>state.grade,v=>state.grade=v,'any grade');
  chips('catChips',[['quest','quest'],['dungeon','dungeon'],['challenge','challenge'],['adventure','adventure'],['item','item'],['growth','growth']],()=>state.cat,v=>state.cat=v,'any source');
  // stat chips (top 30 + any selected)
  const sc=$('statChips');sc.innerHTML='';
  const sq=($('statQ').value||'').toLowerCase();
  const shown=[...new Set([...(sq?STATS.filter(k=>k.includes(sq)):STATS.slice(0,30)),...state.stats])];
  for(const k of shown){const b=document.createElement('button');
    b.textContent=k;if(state.stats.has(k))b.classList.add('on');
    b.onclick=()=>{state.stats.has(k)?state.stats.delete(k):state.stats.add(k);render();};
    sc.appendChild(b);}
  // filter
  const q=state.q.toLowerCase();
  let rows=T.filter(t=>
    (state.race===null||t.r===state.race||t.r==='all')&&
    (state.slot===null||(state.slot==='none'?!t.s:t.s===state.slot))&&
    (state.grade===null||t.g===state.grade)&&
    (state.cat===null||t.c===state.cat)&&
    (!q||t.n.toLowerCase().includes(q)||t.d.toLowerCase().includes(q)));
  const scored=state.stats.size>0;
  if(scored)rows=rows.map(t=>[score(t),t]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  else rows=rows.map(t=>[0,t]).sort((a,b)=>b[1].g-a[1].g||a[1].n.localeCompare(b[1].n));
  // top pick per slot
  const tp=$('top3');tp.innerHTML='';
  if(scored){for(const slot of ['attack','defense','utility']){
    const best=rows.find(([s,t])=>t.s===slot);
    if(best){const [s,t]=best;
      tp.innerHTML+=`<div class="pick"><div class="slot">best ${slot}</div>

  $('count').textContent=`${rows.length} title${rows.length!==1?'s':''}${scored?' carrying selected stats':''}`;
  $('rows').innerHTML=rows.slice(0,80).map(([s,t])=>`<tr>
    <td class="score">${scored?s:''}</td>
    <td class="nm" style="color:${gc(t.g)}">${t.n}</td>
    <td>${t.s||'—'}</td>
    <td style="color:${gc(t.g)}">${gn(t.g)}</td>
    <td>${fmt(t.e,state.stats)}</td>
    <td>${fmt(t.o,state.stats)}</td>
    <td class="desc">${t.c} · ${t.d}</td></tr>`).join('')
    +(rows.length>80?`<tr><td colspan="7" style="color:var(--ink3)">…${rows.length-80} more (refine filters)</td></tr>`:'');
}
$('q').oninput=e=>{state.q=e.target.value;render();};
$('statQ').oninput=()=>render();
render();
